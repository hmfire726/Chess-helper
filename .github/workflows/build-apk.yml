name: APK 빌드

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 서명 키 준비 (Secrets에 있을 때만)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "릴리스 키로 서명합니다."
          else
            echo "Secrets에 서명 키가 없어 디버그 키로 서명합니다."
          fi

      - name: 테스트 + APK 빌드
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ChessHelper.apk

      - name: 빌드 결과 업로드 (Actions 탭에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-apk
          path: ChessHelper.apk

      - name: 최신 APK 릴리스 갱신 (기본 브랜치에서만)
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ChessHelper.apk \
            --title "체스 도우미 최신 APK" \
            --notes "커밋 ${{ github.sha }} 에서 자동 빌드되었습니다." \
            --target ${{ github.sha }}
